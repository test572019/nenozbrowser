<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>Claude</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="panel.css">
</head>
<body class="panel">
  <header>
    <strong>Claude</strong>
    <span class="sp"></span>
    <button id="new" hidden>New chat</button>
    <button id="removeKey" hidden>Remove key</button>
  </header>

  <section id="setup" hidden>
    <h2>Connect your Anthropic account</h2>
    <p>Enter your own API key. It is encrypted on this computer and sent only to api.anthropic.com. Create a key at console.anthropic.com.</p>
    <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" aria-label="Anthropic API key">
    <button id="saveKey" class="primary">Save key</button>
    <p id="keyErr" class="err" hidden></p>
  </section>

  <section id="chat" hidden>
    <div id="ctx"><b id="ctxTitle"></b><span id="ctxUrl"></span></div>
    <button id="askPage" class="primary">Ask About This Page</button>
    <div id="msgs" aria-live="polite"></div>
    <p id="empty">Ask a question, or select text on the page first to ask about just that part.</p>
    <p id="err" class="err" hidden></p>
    <div id="composer">
      <label><input id="usePage" type="checkbox" checked> Use this page as context</label>
      <textarea id="input" rows="3" placeholder="Ask Claude" aria-label="Message"></textarea>
      <button id="send" class="primary">Send</button>
    </div>
  </section>
  <script src="panel.js"></script>
</body>
</html>
